name: 'cost_optimization_integration_tests'
version: '1.0.0'
config-version: 2

# Integration tests for the Snowflake side of dbt_cost_optimization.
# Fixture models stand in for SNOWFLAKE.ACCOUNT_USAGE views. The test commands point
# the package's snowflake_usage source at them with --vars, because dbt v1 doesn't
# render Jinja in var values (see TESTING.md at the repo root).
#
# Uses the package's own profile name, so the same ~/.dbt/profiles.yml target works
# for unit tests (repo root) and integration tests (this project).
profile: 'dbt_cost_optimization'

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  # Build the package's models into their own schema, <target schema>_integration, not
  # the <target schema>_dbt_cost_optimization schema the package's unit tests use. Unit
  # tests read their parents' column types from that schema, so fixture data built there
  # would change the types they see.
  # The var lets another configuration (e.g. Enterprise edition, the smoke test) build
  # into its own schema: --vars '{package_test_schema: integration_enterprise}'.
  dbt_cost_optimization:
    +schema: "{{ var('package_test_schema', 'integration') }}"
    snowflake:
      intermediate:
        int_snowflake__warehouse_config:
          # Simulated SHOW WAREHOUSES values for fixture warehouses (Enterprise edition),
          # for the multi-cluster branches. See macros/simulate_show_warehouses.sql.
          +post-hook:
            - "{{ simulate_show_warehouses() }}"
      marts:
        clustering:
          fct_snowflake__table_clustering_candidates:
            # Keep a stale snapshot (dated a week ago, with 10x the reads) next to today's,
            # as the table accumulates in real projects. The backlog must read only the
            # latest snapshot (assert_gold_all_recommendations, assert_gold_views).
            +post-hook:
              - "delete from {{ this }} where snapshot_date = dateadd(day, -7, current_date())"
              - "insert into {{ this }} select * replace (
                     md5(clustering_candidates_snapshot_key || '|stale') as clustering_candidates_snapshot_key,
                     dateadd(day, -7, snapshot_date) as snapshot_date,
                     select_count * 10 as select_count)
                 from {{ this }} where snapshot_date = current_date()"

  cost_optimization_integration_tests:
    # Deliberately shaped models for the package to analyze. They only need to exist;
    # their behavior comes from the fixture query history that references them.
    demo:
      +materialized: view
    # Stand-ins for ACCOUNT_USAGE views, built into <target schema>_fixtures.
    # Build these first: dbt build --select tag:fixtures
    account_usage_fixtures:
      +materialized: table
      +schema: fixtures
      +tags: ['fixtures']

# dbt v1 doesn't read vars.yml, so the project's vars live here. The package's on/off
# settings (DBT_COST_OPTIMIZATION_ENABLED, ..._SNOWFLAKE_ENTERPRISE_EDITION) are also set
# as environment variables in the test commands: on dbt v1, the package's dbt_project.yml
# gates only see those. The source location (snowflake_usage_database/_schema) is passed
# with --vars, since it depends on the target.
vars:
  dbt_cost_optimization_enabled: true

  # Materialization slice uses the Standard-edition path (query-text attribution),
  # so only the query_history fixture is needed.
  snowflake_enterprise_edition: false

  # Clustering slice: the demo table is small, so drop the size floor.
  clustering_candidates_min_size_gb: 0

  # Clustering slice: analyze 10 of DEMO_EVENTS' 20 reads, so the clustering savings'
  # filter share must use the analyzed count (10), not all reads (20).
  clustering_key_operator_queries_per_table: 10

  # View chain slice: probe only the two chain views (the deepest chain comes first), so
  # demo_slow_view keeps its read-duration cost and fixed expectations. Re-probe every
  # run, so the incremental run probes the same two views.
  table_materialization_view_probe_limit: 2
  table_materialization_view_probe_refresh_days: 0
